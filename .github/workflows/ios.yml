name: BinnenApp iPhone build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          cd ios
          xcodegen generate
      - name: Geometry and payload tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcodebuild test -project ios/BinnenApp.xcodeproj -scheme BinnenApp -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath ios/build/Tests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned iPhone archive
        run: |
          xcodebuild archive -project ios/BinnenApp.xcodeproj -scheme BinnenApp -configuration Release -destination 'generic/platform=iOS' -archivePath ios/build/BinnenApp.xcarchive CODE_SIGNING_ALLOWED=NO
          ditto -c -k --keepParent ios/build/BinnenApp.xcarchive ios/build/BinnenApp-unsigned.xcarchive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BinnenApp-iPhone-unsigned
          path: ios/build/BinnenApp-unsigned.xcarchive.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BinnenApp-iPhone-tests
          path: ios/build/Tests.xcresult
          retention-days: 7
