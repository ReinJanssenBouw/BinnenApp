name: BinnenApp
options:
  bundleIdPrefix: nl.janssenbouw
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  BinnenApp:
    type: application
    platform: iOS
    sources: [BinnenApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.janssenbouw.binnenapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BinnenApp
        INFOPLIST_KEY_NSCameraUsageDescription: Bekijk je stellingen en productlocaties via de ingebouwde AR-camera.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  BinnenAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BinnenAppTests]
    dependencies:
      - target: BinnenApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BinnenApp:
    build:
      targets:
        BinnenApp: all
        BinnenAppTests: [test]
    test:
      targets: [BinnenAppTests]
