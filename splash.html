<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BinnenApp</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(160deg, #1e40af 0%, #1d4ed8 40%, #1e3a8a 100%);
  width: 100vw; height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  overflow: hidden; user-select: none;
}

body::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.07) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 90%, rgba(30,58,138,.4) 0%, transparent 60%);
  pointer-events: none;
}

.logo-mark {
  width: 80px; height: 80px;
  border-radius: 22px;
  background: rgba(255,255,255,.15);
  backdrop-filter: blur(8px);
  border: 1.5px solid rgba(255,255,255,.25);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px;
}

.logo-mark img {
  width: 52px; height: 52px;
  object-fit: contain;
}

h1 {
  color: #fff;
  font-size: 28px; font-weight: 800;
  letter-spacing: .02em;
  margin-bottom: 6px;
}

.sub {
  color: rgba(255,255,255,.55);
  font-size: 13px; font-weight: 600;
  margin-bottom: 48px;
}

.status-area {
  display: flex; flex-direction: column;
  align-items: center; gap: 14px;
}

.spinner {
  width: 32px; height: 32px;
  border: 3px solid rgba(255,255,255,.2);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.status-text {
  color: rgba(255,255,255,.8);
  font-size: 13px; font-weight: 600;
}

.progress-wrap {
  width: 220px;
  background: rgba(255,255,255,.15);
  border-radius: 99px; height: 6px;
  overflow: hidden;
  display: none;
}

.progress-bar {
  height: 100%;
  background: #fff;
  border-radius: 99px;
  transition: width .3s ease;
  width: 0%;
}

.version {
  position: fixed; bottom: 18px;
  color: rgba(255,255,255,.3);
  font-size: 11px; font-weight: 600;
}
</style>
</head>
<body>

<div class="logo-mark">
  <img src="BinnenAppLogoWit.png" alt="BinnenApp">
</div>

<h1>BinnenApp</h1>
<div class="sub">Janssen Bouw</div>

<div class="status-area">
  <div class="spinner" id="spinner"></div>
  <div class="status-text" id="statusText">BinnenApp starten...</div>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
</div>

<div class="version" id="versionLabel"></div>

<script>
  const statusText   = document.getElementById('statusText');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar  = document.getElementById('progressBar');
  const versionLabel = document.getElementById('versionLabel');

  window.splashBridge.onStatus((data) => {
    switch (data.type) {
      case 'version':
        versionLabel.textContent = `v${data.version}`;
        break;
      case 'starting':
        statusText.textContent = 'BinnenApp starten...';
        break;
      case 'checking-update':
        statusText.textContent = 'Controleren op updates...';
        break;
      case 'loading-data':
        progressWrap.style.display = 'block';
        statusText.textContent = data.label || 'Gegevens laden...';
        if (data.percent != null) progressBar.style.width = `${data.percent}%`;
        break;
      case 'downloading':
        progressWrap.style.display = 'block';
        statusText.textContent = data.percent > 0
          ? `Update downloaden... ${data.percent}%`
          : 'Update downloaden...';
        progressBar.style.width = `${data.percent}%`;
        break;
      case 'installing':
        statusText.textContent = 'Installeren en herstarten...';
        progressBar.style.width = '100%';
        break;
    }
  });
</script>
</body>
</html>
