<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e40af">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BinnenApp">
<title>BinnenApp</title>
<meta name="description" content="Bestellen en voorraad voor de binnenploeg van Janssen Bouw">
<link rel="icon" type="image/png" sizes="192x192" href="/binnenapp-icoon-blauw-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=blauw-ipad-2">
<link rel="apple-touch-icon" sizes="152x152" href="/binnenapp-icoon-blauw-152.png?v=2">
<link rel="apple-touch-icon" sizes="167x167" href="/binnenapp-icoon-blauw-167.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/binnenapp-icoon-blauw-180.png?v=2">
<link rel="manifest" href="manifest.json?v=android-blauw-2">
<link rel="stylesheet" href="style.css?v=20260924-locatie-indeling">
<link rel="stylesheet" href="pdf-bekijker.css?v=20260909-pdf">
</head>
<body>

<!-- Laadscherm -->
<div id="splash" class="splash">
  <img src="/BinnenAppLogoWit.png" alt="">
  <h1>BinnenApp</h1>
  <p>Janssen Bouw</p>
  <div class="spinner"></div>
</div>

<!-- Inloggen -->
<div id="login" class="login hidden">
  <div class="login-box">
    <img src="/BinnenAppLogoWit.png" alt="">
    <h1>BinnenApp</h1>
    <p>Janssen Bouw &middot; Binnenploeg</p>
    <form id="loginForm" autocomplete="on">
      <div id="naamRij" hidden>
        <label for="loginNaam">Naam</label>
        <input id="loginNaam" type="text" autocomplete="name" placeholder="Jouw naam">
      </div>
      <label for="loginEmail">E-mailadres</label>
      <input id="loginEmail" type="email" inputmode="email" autocomplete="username" required placeholder="jij@janssen-bouw.nl">
      <label for="loginWachtwoord">Wachtwoord</label>
      <input id="loginWachtwoord" type="password" autocomplete="current-password" required placeholder="Wachtwoord">
      <button type="submit" id="loginKnop">Inloggen</button>
      <button type="button" id="loginWissel">Nog geen account? Aanmelden</button>
      <p class="login-fout" id="loginFout"></p>
      <div class="login-uitleg" id="loginUitleg" hidden>
        Een nieuw account moet eerst worden goedgekeurd voordat je erin kunt.
        Je krijgt bericht zodra dat gebeurd is.
      </div>
    </form>
  </div>
</div>

<!-- App -->
<div id="app" class="app hidden">

  <header class="topbar">
    <div class="topbar-merk">
      <img class="topbar-logo" src="/BinnenAppLogoWit.png" alt="">
      <div>
        <span class="topbar-eyebrow" id="topbarEyebrow">Janssen Bouw &middot; Binnenploeg</span>
        <h1 id="topbarTitel">Winkel</h1>
      </div>
    </div>
    <div class="topbar-acties">
      <button class="topbar-knop" id="meldingenKnop" title="Meldingen" aria-label="Meldingen instellen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="melding-punt" aria-hidden="true"></span>
      </button>
      <button class="topbar-knop" id="uitlogKnop" title="Uitloggen" aria-label="Uitloggen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <main id="scherm" class="scherm"></main>

  <nav class="tabbar" id="tabbar" aria-label="Hoofdnavigatie">
    <span class="tab-indicator" aria-hidden="true"></span>
    <button data-tab="winkel" class="tab actief" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
      <span>Winkel</span>
    </button>
    <button data-tab="wagen" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Wagen</span>
      <i class="tab-badge" id="wagenBadge" hidden>0</i>
    </button>
    <button data-tab="bestellingen" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>Besteld</span>
    </button>
    <button data-tab="voorraad" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
      <span>Voorraad</span>
    </button>
    <button data-tab="retour" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span>Retour</span>
      <i class="tab-badge" id="retourBadge" hidden>0</i>
    </button>
    <button data-tab="locatie" class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Locatie</span>
    </button>
  </nav>

</div>

<div id="toast" class="toast"></div>
<div id="blad" class="blad"><div class="blad-inhoud" id="bladInhoud"></div></div>

<script src="pdf-bekijker.js?v=20260909-pdf"></script>
<link rel="stylesheet" href="locaties.css?v=2">
<script src="locaties.js?v=2"></script>
<script type="module" src="app.js?v=20260924-locatie-indeling"></script>
</body>
</html>
