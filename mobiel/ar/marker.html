<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BinnenApp AR-marker</title><style>body{font:16px/1.5 system-ui;text-align:center;margin:24px;color:#16324f}img{display:block;width:min(80vw,65vh);height:auto;margin:24px auto}button{padding:12px 20px;font:inherit}p{max-width:600px;margin:15px auto}@media print{@page{size:A4;margin:5mm}h1,p,button{display:none}body{margin:0}img{width:200mm;height:200mm;margin:20mm 0 0}}</style></head><body><h1>BinnenApp AR-marker</h1><p>Laat dit scherm open op een pc of tablet. Open op je iPhone BinnenApp → Locatie → AR-proef en richt de camera op dit vierkant.</p><img src="hiro.png" alt="Hiro-herkenningsmarker: zwart vierkant met witte kern en het woord Hiro"><button onclick="window.print()">Marker printen</button><p>Print op 100% schaal. Het zwarte vierkant is dan 18,4 cm breed. Controleer de maat voor uitlijning met een echte stelling. Houd de witte marge vrij.</p></body></html>
